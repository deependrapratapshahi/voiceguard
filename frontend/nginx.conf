server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API calls to the backend service.
    location /api/ {
        proxy_pass https://voiceguard-backend-rice.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket calls to the backend service.
    location /ws/ {
        proxy_pass https://voiceguard-backend-rice.onrender.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: any other route serves index.html so React Router
    # handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
